<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Low Orbit</title>
<meta name="theme-color" content="#04060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Low Orbit">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="stage"><div id="app"></div></div>
<div id="scan" aria-hidden="true"></div>
<div id="ignite" aria-hidden="true"></div>

<nav id="tabs" aria-label="Main">
  <i id="tabline"></i>
  <a href="#/today" data-tab="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg><span>Today</span></a>
  <a href="#/progress" data-tab="1"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16c4 0 5-3 8-6s5-4 8-6"/><circle cx="20" cy="4" r="1.6"/></svg><span>Progress</span></a>
  <a href="#/history" data-tab="2"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>History</span></a>
  <a href="#/plan" data-tab="3"><svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h8"/><circle cx="18" cy="7" r="1.8"/><circle cx="16" cy="17" r="1.8"/></svg><span>Plan</span></a>
  <a href="#/settings" data-tab="4"><svg viewBox="0 0 24 24"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.6"/></svg><span>Systems</span></a>
</nav>

<div id="restbar" class="hide" role="timer" aria-live="off">
  <div class="rb-fill"></div>
  <div class="rb-in">
    <div><small>REST</small><b id="rb-time">0:00</b></div>
    <div class="rb-btns">
      <button data-act="restAdd" data-n="-15" aria-label="minus 15 seconds">−15</button>
      <button data-act="restAdd" data-n="15" aria-label="plus 15 seconds">+15</button>
      <button data-act="restSkip" class="go">SKIP</button>
    </div>
  </div>
</div>

<div id="sheets"></div>
<div id="toast" role="status"></div>
<div id="boot" class="hide"></div>

<noscript><p style="color:#ddd;padding:24px">Low Orbit needs JavaScript.</p></noscript>

<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/v-today.js"></script>
<script src="js/v-burn.js"></script>
<script src="js/v-progress.js"></script>
<script src="js/v-history.js"></script>
<script src="js/v-plan.js"></script>
<script src="js/v-extras.js"></script>
<script src="js/v-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
